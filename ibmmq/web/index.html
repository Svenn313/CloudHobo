<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcours IBM MQ</title>
<style>
  :root {
    --bg: #f3f4f7; --panel: #ffffff; --fg: #1b2230; --muted: #5d6679; --line: #dfe3ea;
    --accent: #0f62fe; --accent-fg: #ffffff; --ok: #198038; --ok-bg: #e3f4e8;
    --bad: #b3261e; --bad-bg: #fbe7e5; --code-bg: #0f1623; --code-fg: #d9e2f2; --lock: #9aa3b5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161e; --panel: #1c222d; --fg: #e8ebf1; --muted: #9aa3b5; --line: #2c3442;
      --accent: #78a9ff; --accent-fg: #0b1220; --ok: #6fdc8c; --ok-bg: #16301e;
      --bad: #ff8c85; --bad-bg: #3a1c1a; --code-bg: #0b0f17; --code-fg: #d9e2f2; --lock: #5d6679;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
  h1 { margin: 0; font-size: 1.4rem; }
  .links a { color: var(--accent); margin-right: 16px; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .layout { max-width: 1200px; margin: 0 auto; padding: 8px 16px 48px; display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  aside { padding: 16px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  @media (max-width: 820px) { aside { position: static; max-height: none; } }
  aside h2 { margin: 0 0 4px; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .count { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
  .week { margin-top: 16px; }
  .week h3 { margin: 0 0 6px; font-size: .9rem; }
  .week h3 span { color: var(--muted); font-weight: 400; }
  .day { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 10px; margin: 2px 0; background: none; border: 1px solid transparent; border-radius: 8px; color: inherit; font: inherit; font-size: .92rem; cursor: pointer; }
  .day:hover:not(:disabled) { background: var(--bg); }
  .day[aria-current="true"] { border-color: var(--accent); background: var(--bg); }
  .day:disabled { color: var(--lock); cursor: not-allowed; }
  .day .n { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; border: 1px solid var(--line); }
  .day.done .n { background: var(--ok); border-color: var(--ok); color: var(--panel); }
  .day.today .n { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  main { padding: 24px; min-width: 0; }
  @media (max-width: 520px) { main { padding: 16px; } }
  .kicker { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; }
  main h2 { margin: 4px 0 6px; font-size: 1.5rem; }
  .meta { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .8rem; background: var(--ok-bg); color: var(--ok); margin-left: 8px; }
  .goal { padding: 12px 14px; border-left: 4px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; margin: 0 0 18px; }
  h3.sec { margin: 24px 0 8px; font-size: 1rem; }
  p { margin: 0 0 10px; }
  code { background: var(--bg); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
  .step { margin: 0 0 16px; }
  .step .t { margin-bottom: 6px; }
  .cmd { position: relative; background: var(--code-bg); color: var(--code-fg); border-radius: 8px; padding: 10px 76px 10px 12px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto; white-space: pre; }
  .cmd button { position: absolute; top: 6px; right: 6px; font: inherit; font-size: 12px; padding: 3px 10px; background: transparent; color: var(--code-fg); border: 1px solid #4a5568; border-radius: 6px; cursor: pointer; }
  .cmd button:hover { background: #1f2a3d; }
  .link a { color: var(--accent); }
  ul.plain { margin: 0; padding-left: 20px; }
  ul.plain li { margin: 3px 0; }
  .check { margin-top: 28px; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .check h3 { margin: 0 0 8px; }
  .quiz label { display: block; margin: 10px 0 4px; }
  .quiz input { width: 100%; padding: 8px 10px; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .quiz input:focus-visible, button.primary:focus-visible, .day:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { margin-top: 14px; padding: 10px 18px; font: inherit; font-weight: 600; color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  button.primary:disabled { opacity: .6; cursor: wait; }
  .results { list-style: none; margin: 14px 0 0; padding: 0; }
  .results li { display: flex; gap: 10px; padding: 8px 10px; margin: 4px 0; border-radius: 8px; background: var(--panel); }
  .results li.ok { background: var(--ok-bg); }
  .results li.ko { background: var(--bad-bg); }
  .results .ic { flex: none; font-weight: 700; }
  .results .ok .ic { color: var(--ok); }
  .results .ko .ic { color: var(--bad); }
  .results small { display: block; color: var(--muted); }
  .success { margin-top: 14px; padding: 14px; border-radius: 10px; background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .success button { margin-top: 10px; }
  .error { color: var(--bad); margin-top: 10px; }
  footer { max-width: 1200px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: .85rem; }
  footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
</style>
</head>
<body>
<header>
  <h1>Parcours IBM MQ</h1>
  <div class="links">
    <a href="https://mq1.svenlabs.fr/ibmmq/console/" target="_blank" rel="noopener">Console QM1</a>
    <a href="https://mq2.svenlabs.fr/ibmmq/console/" target="_blank" rel="noopener">Console QM2</a>
  </div>
</header>

<div class="layout">
  <aside class="panel" aria-label="Programme">
    <h2>Programme</h2>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="24" id="bar"><i></i></div>
    <div class="count" id="count"></div>
    <nav id="program"></nav>
  </aside>
  <main class="panel" id="main" aria-live="polite">Chargement…</main>
</div>

<footer><button id="reset" type="button">Réinitialiser ma progression</button></footer>

<script src="program.js"></script>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

let state = { validated: {}, current: 1, last: 24 };
let viewing = 1;

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
  return data;
}

function renderProgram() {
  const done = Object.keys(state.validated).length;
  $('#bar > i').style.width = `${(done / state.last) * 100}%`;
  $('#bar').setAttribute('aria-valuenow', done);
  $('#count').textContent = done === state.last ? 'Parcours terminé 🎉' : `${done} / ${state.last} exercices validés`;
  $('#program').innerHTML = WEEKS.map(w => `
    <div class="week">
      <h3>${esc(w.name)} <span>· ${esc(w.title)}</span></h3>
      ${w.days.map(d => {
        const p = PROGRAM.find(x => x.day === d);
        const isDone = String(d) in state.validated;
        const locked = d > state.current;
        const cls = ['day', isDone ? 'done' : '', d === state.current ? 'today' : ''].join(' ');
        return `<button class="${cls}" data-day="${d}" ${locked ? 'disabled' : ''} ${d === viewing ? 'aria-current="true"' : ''}
          title="${locked ? 'Valide les exercices précédents pour débloquer' : ''}">
          <span class="n">${isDone ? '✓' : locked ? '🔒' : d}</span><span>${esc(p.title)}</span></button>`;
      }).join('')}
    </div>`).join('');
}

function stepHtml(s) {
  const cmd = s.link ? '' : buildCmd(s);
  return `<div class="step">
    ${s.t ? `<div class="t">${fmt(s.t)}</div>` : ''}
    ${s.link ? `<div class="link"><a href="${esc(s.link[0])}" target="_blank" rel="noopener">${esc(s.link[1])} ↗</a></div>` :
      `<div class="cmd"><button type="button" data-copy>Copier</button>${esc(cmd)}</div>`}
  </div>`;
}

function renderDay() {
  const d = PROGRAM.find(x => x.day === viewing);
  const done = state.validated[String(viewing)];
  const isCurrent = viewing === state.current;
  const before = d.steps.filter(s => !s.after);
  const after = d.steps.filter(s => s.after);
  const html = [];
  html.push(`<div class="kicker">Jour ${d.day} sur ${state.last}${done ? '<span class="badge">Validé</span>' : isCurrent ? '<span class="badge" style="background:var(--bg);color:var(--accent)">Exercice du jour</span>' : ''}</div>`);
  html.push(`<h2>${esc(d.title)}</h2><div class="meta">⏱ environ ${d.minutes} minutes</div>`);
  html.push(`<p class="goal">${fmt(d.goal)}</p>`);
  html.push(`<h3 class="sec">À retenir</h3>${d.learn.map(p => `<p>${fmt(p)}</p>`).join('')}`);
  if (d.challenge) html.push(`<h3 class="sec">Ton défi</h3><ul class="plain">${d.challenge.map(c => `<li>${fmt(c)}</li>`).join('')}</ul>`);
  if (before.length) html.push(`<h3 class="sec">À faire</h3>${before.map(stepHtml).join('')}`);
  if (d.questions?.length) html.push(`<h3 class="sec">Pour y réfléchir</h3><ul class="plain">${d.questions.map(q => `<li>${fmt(q)}</li>`).join('')}</ul>`);

  html.push('<section class="check" id="check"><h3>Checkpoint</h3>');
  if (d.verify?.length) html.push(`<p>Je vais vérifier sur tes queue managers :</p><ul class="plain">${d.verify.map(v => `<li>${fmt(v)}</li>`).join('')}</ul>`);
  if (d.quiz?.length) html.push(`<div class="quiz">${d.quiz.map(q => `<label for="q-${q.id}">${fmt(q.q)}</label><input id="q-${q.id}" data-quiz="${q.id}" autocomplete="off" spellcheck="false">`).join('')}</div>`);
  if (done) {
    html.push(`<div class="success">✓ Validé le ${new Date(done).toLocaleDateString('fr-FR')}</div>`);
  } else if (isCurrent) {
    html.push('<button class="primary" id="validate" type="button">Valider le checkpoint</button><div id="out"></div>');
  }
  html.push('</section>');

  if (after.length && (done || isCurrent)) html.push(`<h3 class="sec">Après la validation</h3>${after.map(stepHtml).join('')}`);
  $('#main').innerHTML = html.join('');
}

function render() { renderProgram(); renderDay(); }

async function validate() {
  const btn = $('#validate');
  const out = $('#out');
  const answers = {};
  document.querySelectorAll('[data-quiz]').forEach(i => { answers[i.dataset.quiz] = i.value; });
  btn.disabled = true; btn.textContent = 'Vérification…'; out.innerHTML = '';
  try {
    const r = await api('/api/check', { day: viewing, answers });
    out.innerHTML = `<ul class="results">${r.results.map(x => `
      <li class="${x.ok ? 'ok' : 'ko'}"><span class="ic">${x.ok ? '✓' : '✗'}</span><span>${fmt(x.label)}${x.detail && !x.ok ? `<small>${esc(x.detail)}</small>` : ''}</span></li>`).join('')}</ul>`;
    if (r.ok) {
      state = r.progress;
      renderProgram();
      const next = viewing < state.last
        ? `<button class="primary" id="next" type="button">Passer à l'exercice suivant →</button>` : '';
      out.insertAdjacentHTML('beforeend', `<div class="success">Bravo, checkpoint validé. ${next}</div>`);
      btn.remove();
      $('#next')?.addEventListener('click', () => { viewing = state.current; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    } else {
      btn.disabled = false; btn.textContent = 'Revérifier';
    }
  } catch (e) {
    out.innerHTML = `<div class="error">${esc(e.message)}</div>`;
    btn.disabled = false; btn.textContent = 'Revérifier';
  }
}

document.addEventListener('click', async e => {
  const day = e.target.closest('.day');
  if (day && !day.disabled) { viewing = Number(day.dataset.day); render(); return; }
  if (e.target.id === 'validate') return validate();
  const copy = e.target.closest('[data-copy]');
  if (copy) {
    const text = copy.parentElement.textContent.replace(copy.textContent, '');
    try { await navigator.clipboard.writeText(text); copy.textContent = 'Copié ✓'; }
    catch { const r = document.createRange(); r.selectNodeContents(copy.parentElement); getSelection().removeAllRanges(); getSelection().addRange(r); copy.textContent = 'Sélectionné'; }
    setTimeout(() => { copy.textContent = 'Copier'; }, 1500);
  }
});

$('#reset').addEventListener('click', async () => {
  if (!confirm('Effacer toute ta progression ?')) return;
  state = await api('/api/reset', {});
  viewing = 1; render();
});

(async () => {
  try {
    state = await api('/api/progress');
    viewing = Math.min(state.current, state.last);
    render();
  } catch (e) {
    $('#main').innerHTML = `<div class="error">Impossible de charger la progression : ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
