- Maison & réseau:
    - Home Assistant:
        icon: home-assistant.png
        href: https://homeassistant.{{HOMEPAGE_VAR_DOMAIN}}
        description: Domotique
        container: homeassistant
        server: local
        widget:
          type: homeassistant
          url: http://host.docker.internal:8123
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
    - Pi-hole:
        icon: pi-hole.png
        href: https://pihole.{{HOMEPAGE_VAR_DOMAIN}}
        description: DNS / blocage pub
        container: pihole
        server: local
        widget:
          type: pihole
          url: http://host.docker.internal:8081
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
    - Box:
        icon: bbox.png
        href: https://box.{{HOMEPAGE_VAR_DOMAIN}}
        description: Routeur Bbox

- Monitoring:
    - Beszel:
        icon: beszel.png
        href: https://beszel.{{HOMEPAGE_VAR_DOMAIN}}
        description: Stats serveur
        container: beszel
        server: local
    - Dozzle:
        icon: dozzle.png
        href: https://dozzle.{{HOMEPAGE_VAR_DOMAIN}}
        description: Logs Docker
        container: dozzle
        server: local
    - Synapse Admin:
        icon: matrix.png
        href: https://synapse-admin.{{HOMEPAGE_VAR_DOMAIN}}
        description: Admin Matrix
        container: synapse-admin
        server: local
